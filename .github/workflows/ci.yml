name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cache: pip retained under contents: read (no broader permission).
      # Verified against a real successful run
      # (https://github.com/B0LK13/project-atlas/actions/runs/30905727068/job/91980229911):
      # "GITHUB_TOKEN Permissions" logged only Contents: read / Metadata: read,
      # and the cache step logged "Cache hit" + "Cache restored successfully"
      # with no permission warning or error. No broader permission is
      # justified by this evidence.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest
        run: python -m pytest

      - name: CLI smoke (AT-001 scaffold contract)
        run: |
          atlas --help
          atlas version
          atlas init --output .tmp/atlas-vault --dry-run
          atlas init --output .tmp/atlas-vault
          test -f .tmp/atlas-vault/index.md
          test -f .tmp/atlas-vault/00-system/vault-charter.md
