ci_observation:
  finding: >-
    atlas-vault-documentation/tests has no automatic CI coverage: root
    pyproject.toml sets `[tool.pytest.ini_options] testpaths = ["tests"]`,
    so .github/workflows/ci.yml's `python -m pytest` step never runs the
    Control Plane suite, and no separate workflow runs it on push or pull
    request. This defect could not have been caught by CI even on a native
    Linux runner.
  in_scope_of_this_package: false
  recommended_follow_up: >-
    AS-MAINT-002 - Control Plane Push/PR CI Coverage. Not implemented here;
    deliberately out of scope for this mode-only fix.

