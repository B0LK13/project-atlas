schema_version: 1
work_package: AS-MAINT-001
title: Control Plane Test Fixture Executable-Bit Portability
status: implemented-evidence-recorded-pending-owner-merge
certified_base_commit: 7e720bda1a9efe3950a7943968024805fdfd2f6f
implementation_commit: cf858185af9ea0aa18e550130f1fafab1e2e74b4
evidence_commit: SELF

summary: >-
  atlas-vault-documentation/tests/fixtures/bin/mda is invoked directly (not
  via `[sys.executable, <script>, ...]`) by several Control Plane tests and
  by ATLAS_MDA_COMMAND-driven tooling, but was committed at git mode 100644.
  core.filemode=false means the tracked mode has never picked up a local
  chmod, so on any filesystem that honors real POSIX mode bits (ext4, and
  any standard Linux CI runner) invoking it fails with "permission-denied"
  instead of executing. On DrvFS-mounted Windows paths (e.g. /mnt/d under
  WSL) all files present as world-executable regardless of tracked mode,
  which is why this went unnoticed when working directly under
  /mnt/d/project-atlas-vault. This package fixes only the git mode.

root_cause: >-
  `git ls-tree 7e720bda -- atlas-vault-documentation/tests/fixtures/bin/mda`
  shows mode 100644. The repository has core.filemode=false, so git never
  updates that bit from a working tree's local chmod; the fixture has been
  non-executable in every commit since it was introduced, unrelated to any
  AS-SEC-001 change.

fix:
  path: atlas-vault-documentation/tests/fixtures/bin/mda
  git_mode_before: "100644"
  git_mode_after: "100755"
  method: git update-index --chmod=+x atlas-vault-documentation/tests/fixtures/bin/mda
  content_sha256_before: c124cb66fd0464230e731bba2a156769ab640b1142044f66d4ace32c5218e26e
  content_sha256_after: c124cb66fd0464230e731bba2a156769ab640b1142044f66d4ace32c5218e26e
  content_unchanged: true
  diff_stat: "1 file changed, 0 insertions(+), 0 deletions(-) (mode-only)"

sibling_fixture_audit:
  method: >-
    `git ls-files -s | awk '{print $1}' | grep -v '^100644$'` against the
    implementation commit found zero tracked files with any executable git
    mode anywhere in the repository (i.e. this fixture was the only one
    affected, and no other fixture was already correctly marked
    executable). Additionally enumerated every tracked file with a shebang
    line; every other shebang-bearing file is under
    atlas-vault-documentation/scripts/ and is always invoked as
    `[sys.executable, "<script>.py", ...]` (confirmed in
    atlas_agent.py, run_ctrl_certification.py, run_skill_certification.py,
    test_agent_control.py, ingestion_orchestrator.py), never as a bare
    executable, so the missing bit does not affect them.
  conclusion: complete; no additional executable-mode defect found

