known_limitations:
  - maturity_matrix always reports "unknown" today because no existing
    rule populates ConceptRecord.maturity (CORE-MODEL-001, separate
    backlog item, out of scope here) -- still accurate as of the current
    evidence tip; not addressed by release-closure remediation.
  - capability_report is correctly empty for all three pilots; not
    exercised with real Capability-typed concept data (same root cause)
    -- still accurate as of the current evidence tip.
  - >-
    stale_knowledge relies on sources/manifests/source-manifest.json,
    which is overwritten (not merged) by a later, narrower `atlas
    ingest` batch; accurate only for a single combined discover+ingest
    across all projects in one vault (which is how this package's own
    workflow and tests use it). This ingestion.py behavior itself was
    NOT fixed by release-closure remediation (out of AS-MVP-001-R1's
    allowed paths; owner-accepted as a non-MVP workflow limitation --
    see `release_closure_remediation.multi_batch_manifest_disposition`
    below). The only in-scope change was a portfolio.py mitigation:
    overview.json now reports "unknown" (never a fabricated 0) for a
    project whose sources fell out of a truncated manifest.
  - >-
    _promote() (ingestion.py, shared with other certified packages)
    writes each destination file atomically on its own (temp file +
    os.replace) but provides no cross-file transaction: a failure
    isolated to one specific file partway through a multi-file write
    plan can leave a mix of newly-written and stale files. Not fixed
    here (out of allowed paths); see
    `release_closure_remediation.rollback_test_strengthening` below for
    the precise scope of what was, and was not, proven.
  - >-
    RESOLVED by release-closure remediation (no longer a current
    limitation): the K-004/K-005 golden-fixture gap described here at
    the original da04bd3 implementation freeze was closed by the
    release-closure remediation ending at evidence tip
