epic_i:
  completed_before:
    - id: I-001
      title: Project index generator
    - id: I-006
      title: Conflict review queue
  implemented:
    - id: I-002
      title: Portfolio overview
      output: generated/portfolio/overview.json
    - id: I-003
      title: Maturity matrix
      output: generated/portfolio/maturity-matrix.json
      note: >-
        Categorical only (existing Maturity enum). Every project in the
        current pipeline reports maturity "unknown" because no existing
        knowledge_compiler.py rule populates ConceptRecord.maturity yet
        (a pre-existing gap tracked separately by backlog CORE-MODEL-001,
        not touched by this package). The explicit inputs
        (required_coverage_present, validation_evidence_present,
        open_conflicts) are populated and correctly distinguish the
        pilots even though the categorical label itself does not yet.
    - id: I-004
      title: Documentation gap report
      output: generated/portfolio/documentation-coverage.json
      note: reuses semantic_compiler.coverage_for(); does not recompute rules
    - id: I-005
      title: Stale knowledge report
      output: generated/portfolio/stale-knowledge.json
      note: >-
        Freshness derived from sources/manifests/source-manifest.json's
        modified_at against an injected reference date. Known limitation:
        that manifest file is overwritten (not merged) by each `atlas
        ingest` call, so a vault built from multiple separate ingest
        calls only retains the most recent batch's freshness data; a
        single combined discover+ingest across all projects (the
        pattern used by this package's own pilot workflow and
        acceptance tests) is unaffected. Not fixed here; pre-existing
        ingestion.py behavior, out of AS-MVP-001 scope.
    - id: I-007
      title: Dependency report
      output: generated/portfolio/dependency-report.json
      note: >-
        Existing deterministic RUNTIME_DEPENDENCY claims ("requires:"/
        "dependency:" line extraction, knowledge_compiler.py) plus any
        populated depends_on/related_project concept relationships.
        Verified working end-to-end via the dark-factory -> nebula and
        nebula -> shared-auth-service pilot declarations.
    - id: I-008
      title: Capability report
      output: generated/portfolio/capability-report.json
      note: >-
        Aggregates existing Capability-typed concepts and provides
        relationships. Correctly empty for all three pilots (none
        declares a Capability-typed concept) - verified functional but
        not exercised with real capability data, since the current
        one-concept-per-project model (backlog CORE-MODEL-001, not in
        scope here) makes richer per-source concept typing a separate,
        larger change.

