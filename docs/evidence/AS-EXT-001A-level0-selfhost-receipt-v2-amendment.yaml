  fix, and a full re-run that reconciles exactly with the V2 numbers.
copilot_review_defect:
  source: Copilot review on PR #7 (remote CI all green)
  contract_violated: no-silent-drop (§7.8, §7.9)
  location: src/project_atlas/claim_identity.py, _disambiguate_collisions
  description: >-
    Collision grouping used str(claim["locator"]) as the grouping key.
    Withheld unresolved-locator records have locator None, so every such
    record shared the grouping key "None"; the identical-value dedupe pass
    then dropped repeated unresolved-locator occurrences without any
    diagnostic or counter entry.
  severity: narrow; latent only for sources with 2+ identical unresolved-locator lines
fix:
  commit: 27cd8e8
  change: >-
    locator=None records are ungroupable for the dedupe pass — the record
    index is included in the grouping key — so every unresolved-locator line
    survives and is diagnosed individually. Identical-value dedupe semantics
    for real locators are unchanged.
  regression_tests:
    - test_identical_unresolved_locator_lines_all_survive_no_silent_drop
    - test_identical_unresolved_lines_each_diagnosed_no_silent_drop
