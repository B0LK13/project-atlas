validation:
  ruff_command: python -m ruff check .
  ruff_result: clean
  mypy_command: python -m mypy src
  mypy_result: "clean, 36 source files (unchanged; no src/ file added or modified)"
  pytest_command: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider tests --tb=short -q
  pytest_result: "288 passed, 0 failed (275 pre-existing + 13 new AS-GH-001 governance tests; collect-only cross-checked at 288)"
  compileall_command: python -m compileall -q src atlas-vault-documentation
  compileall_result: clean
  control_plane_command: PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider atlas-vault-documentation/tests --tb=short -q
  control_plane_result: "146 passed, 0 failed (unchanged from baseline)"
  documentation_gate_command: python atlas-vault-documentation/scripts/atlas_agent.py repository-gate --help
  documentation_gate_result: >-
    Confirmed real and invocable (exit 0, prints usage). A full
    invocation requires a governed-session receipt (--receipt) that does
    not apply to this direct-implementation PR; not fabricated as run.
  yaml_and_duplicate_key_command: >-
    python -c "import yaml, glob; [yaml.safe_load(open(p)) for p in
    glob.glob('.github/**/*.yml', recursive=True) +
    glob.glob('docs/evidence/*.yaml')]"
  yaml_and_duplicate_key_result: "24 files parsed, no error, no duplicate key (also covered by tests/unit/test_as_gh_001_governance.py)"

required_check_observation:
  expected_project_owned_check: quality
  note: >-
    The exact check name reported by GitHub on this specific
    implementation branch's own PR is observed only once that PR runs
    through real GitHub Actions; not fabricated here. Prior independent
    verification (AS-GH-001 architecture/post-integration certification
    rounds) already confirmed the live, real check-run name on this
    repository is `quality` (not `ci / quality`), via the GitHub Checks
    API on the certified architecture commit.
  atlas_documentation_gate_status: workflow_dispatch-only, not required, not automatic

security_contact: not_provisioned_deferred
required_approving_reviews_live: 0
signed_commit_enforcement: deferred
github_settings_changed_during_implementation: false

known_limitations:
  - README.md, GOVERNANCE.md, VERSIONING.md, RELEASING.md,
    CODE_OF_CONDUCT.md, SUPPORT.md, and .github/ISSUE_TEMPLATE/* are part
    of ADR-006's full artifact list but were not in this implementation
    phase's explicitly authorized scope; not implemented here, not
    claimed complete.
  - actionlint or an equivalent workflow-syntax linter was not added;
    the governance test suite's own YAML-parse + regex-based checks
    (action pin format, permissions block, trigger set) cover the
    concrete risks this phase targets without adding a new third-party
    dependency.
  - The exact GitHub check name for this specific PR/branch is expected,
    not yet freshly re-observed on this exact diff, until the PR
    actually runs.
  - CODEOWNERS review enforcement, required-check branch-protection
    activation, and restoring required approving reviews to 1 all
    remain separate, later, independently-verified phases per ADR-006's
    own phase sequencing; none is claimed here.

rollback: >-
  Every change in this package is additive or narrowly scoped to the
  files listed in `scope.authorized_paths`. Revert via a normal PR from
  the previous exact tip (this implementation branch's parent,
  42410e968cd3eb392afd66181d64ed3c25e36833); no force-push or history
  rewrite is required or used.

