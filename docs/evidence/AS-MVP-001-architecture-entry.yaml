architecture:
  canonical_boundary: >-
    Portfolio intelligence is strictly derived, regenerable, read-only
    toward canonical records, non-authoritative. Reads only state/claims,
    state/concepts, projects/*/project.md (coverage, maturity,
    relationships fields), the existing generated/indexes/conflicts.json,
    and metadata-only fields of injection-findings.json/
    secret-findings.json. Writes only to a new generated/portfolio/ root
    via the existing _promote(write_plan) boundary. Never writes to
    state/, projects/, sources/, receipts/, or existing
    generated/indexes/*.json.
  generated_outputs:
    - generated/portfolio/overview.json
    - generated/portfolio/maturity-matrix.json
    - generated/portfolio/documentation-coverage.json
    - generated/portfolio/stale-knowledge.json
    - generated/portfolio/dependency-report.json
    - generated/portfolio/capability-report.json
    - generated/navigation/portfolio-overview.md
  cli_integration: >-
    New explicit `atlas build-portfolio --vault <vault-dir>` subcommand,
    following the build-indexes pattern; not folded into build-indexes
    to avoid widening the certified AS-RET-001 contract. atlas validate
    extended with drift rejection for stale generated/portfolio/*.json,
    mirroring the existing build-indexes drift-rejection convention.
  pilot_count: 3
  pilot_profiles:
    - nebula: mature and complete
    - black-agency-os: partial and stale
    - dark-factory: conflicted and dependency-heavy
  determinism: >-
    schema_version + sort_keys=True JSON, sorted project/category
    ordering, no wall-clock timestamps in deterministic bodies (freshness
    reference date is an injected parameter, not datetime.now() called
    inside the generator), no random IDs, no filesystem-enumeration-order
    dependence. Two consecutive build-portfolio runs against unchanged
    state must be byte-identical (acceptance scenario 8); changing one
    pilot changes only that pilot's entries and dependent aggregates
    (acceptance scenario 9).
  maturity_model: >-
    Categorical only, reusing the existing Maturity StrEnum
    (domain/vocabulary.py). No numeric/weighted score. Every matrix entry
    cites its explicit inputs (documentation_coverage_summary,
    open_conflicts, validation_evidence_present), each itself a direct
    read of another generated or canonical value - no opaque score.
  dependency_capability_model: >-
    Aggregates only explicitly declared ConceptRecord.relationships
    (depends_on, related_project, provides) and ConceptType.CAPABILITY
    concepts. No relationship is inferred from prose; ambiguous or absent
    evidence is omitted, never guessed ("unknown" preferred to inference).
  security_boundary: >-
    Reads only existing metadata-only fields of injection-findings.json
    and secret-findings.json (source_id, disposition, rule, confidence -
    never matched text). Quarantined sources are never read from
    sources/imported-documents/ (they are never written there by
    AS-SEC-001). No new detector logic; quarantine.py/secrets.py
    contracts are not reopened or modified.
  implementation_sequence:
    - "AS-MVP-001A step 1: documentation-coverage.json + overview.json"
    - "AS-MVP-001A step 2: maturity-matrix.json"
    - "AS-MVP-001A step 3: stale-knowledge.json (freshness threshold + injected reference date)"
    - "AS-MVP-001A step 4: dependency-report.json + capability-report.json"
    - "AS-MVP-001A step 5: atlas build-portfolio CLI + validate drift rejection"
    - "AS-MVP-001B step 1: nebula fixture + expected golden files"
    - "AS-MVP-001B step 2: black-agency-os + dark-factory fixtures + expected golden files"
    - "AS-MVP-001B step 3: contradiction (K-006) + secret (K-007) fixtures"
    - "AS-MVP-001B step 4: 10 acceptance-scenario integration tests"
    - "independent certification and owner merge"

acceptance_scenarios:
  - "1. all pilots visible in overview/maturity-matrix/documentation-coverage"
  - "2. mature pilot (nebula) not falsely reported missing/stale"
  - "3. partial pilot (black-agency-os) receives accurate missing/partial/stale findings"
  - "4. conflicted pilot (dark-factory) appears in review queue with stable references"
  - "5. declared dependencies appear in deterministic order with provenance"
  - "6. empty vault produces valid empty reports, no crash"
  - "7. invalid project reported safely, does not corrupt other outputs"
  - "8. deterministic rebuild: two settled runs byte-identical"
  - "9. incremental change: only expected project/portfolio outputs update"
  - "10. validate fails closed on generated/portfolio drift"

