adversarial_review:
  verdict: FAIL (one blocking executable violation, five concerns) — remediated
  blocking_violation: >-
    Intra-source yamlpath locator collisions escaped per-source failure
    isolation: a single source containing two records whose canonical locators
    collide raised from the compiler and aborted the whole batch, contradicting
    the §7.7/§7.8 contract (withhold + diagnostic + PARTIAL_CANDIDATE, no
    abort, independent sources unaffected).
  remediation_commit: 33bc65a
  repro_a_nfc_collision:
    fixture: "status: {café(NFC): alpha, café(NFD): beta}"
    before: whole-batch abort via compiler duplicate-ID raise
    after: >-
      Source compiles PARTIAL_CANDIDATE; both colliding candidates withheld
      with DUPLICATE_LOCATOR diagnostics (severity warning, continued,
      staging-only canonical impact); no exception escapes; sibling sources
      promote normally.
    tests:
      - test_repro_a_nfc_collided_locators_withheld_not_abort
      - test_colliding_source_never_blocks_good_sibling (NFC variant)
  repro_b_sequence_key_collision:
    fixture: "status: [{id: same, x: alpha}, {id: same, x: beta}]"
    before: whole-batch abort via compiler duplicate-ID raise
    after: >-
      Source compiles PARTIAL_CANDIDATE; the two colliding .x leaf candidates
      are withheld with DUPLICATE_LOCATOR diagnostics; the identical-value
      status[id=same].id leaf deduplicates to one kept record per §7.7
      identical-value semantics; no abort; siblings unaffected.
    tests:
      - test_repro_b_repeated_stable_sequence_keys_withheld_not_abort
      - test_identical_value_collision_keeps_first_statement
      - test_colliding_source_never_blocks_good_sibling (sequence variant)
  recursion_exhaustion:
    before: raw RecursionError escaped yaml.compose at adversarial depth
    after: >-
      Structured ResourceLimitError (max_depth, "nesting exceeds the parser
      recursion bound") at depths 500/2000/5000; fail-closed, never an
      unhandled exception.
    tests:
      - test_parser_recursion_exhaustion_is_structured_error
remediation:
  blocking_locator_collisions: >-
    New _withhold_locator_collisions in evidence_compiler mirrors §7.7
    disambiguation semantics on yamlpath records: identical-value groups keep
    the first statement (dedupe); different-value collisions withhold all
    members with DUPLICATE_LOCATOR diagnostics and mark the source
    PARTIAL_CANDIDATE. The compiler-level duplicate-ID raise remains as an
    unreachable fail-closed guard (cross-source ids are lineage-namespaced).
  concern_a_unreachable_bounds: >-
    Parser defaults made reachable and meaningful: max_nodes 4096 (was 8192),
    max_node_references 8192 (was 4096). Distinct nodes never exceed
    references, so the node bound is now the tighter one; alias-free documents
    trip max_nodes, alias bombs trip max_node_references. Depth-32 semantics
    clarified (node-visit levels, ≈30–31 user-visible mapping levels).
    Tests: test_limits_actually_enforced_not_documented_only,
    test_default_node_bound_reachable_without_aliases.
  concern_b_recursion_error: see adversarial_review.recursion_exhaustion
  concern_3_promotion_failed_reachable: >-
    ingestion wraps promotion in try/except; on failure the promotable
    candidates are recorded as PROMOTION_FAILED through the governed
    transition edges (COMPLETE_CANDIDATE → PROMOTING → PROMOTION_FAILED) and a
    schema-validated PROMOTION_FAILURE report is written to
    quarantine/promotion-failures/index.json (best-effort, never masks the
    original error); a later successful ingest clears the stale report.
    Rollback of canonical state is unchanged and fully covered.
    Tests: test_promotion_failure_yields_promotion_failed_outcome,
    test_ingestion_mid_promotion_failure_rolls_back_every_file.
  concern_4_wording: see corrections below
  concern_5_unknown_profile_sentence: >-
    docs/work-packages/AS-EXT-001A.md §7.5 now states explicitly that an
    unknown-profile receipt still contributes canonical claims from recognized
    root keys as COMPLETE_CANDIDATE with an unknown-receipt-profile warning
    diagnostic.
  concern_6_classification_persistence: >-
    CompilationCandidate carries the classification record and render_bundle
    persists it per candidate into state/compilation-outcomes/{project}.json;
    all 65 self-host candidates now carry classification records.
corrections:
  quarantine_wording: >-
    Corrected finding accounting: 6 injection findings across 4 files
    (WORKLOG.md, docs/backlog.md,
    docs/adr/ADR-004-source-quarantine-prompt-injection-boundary.md,
    docs/evidence/AS-SEC-001-receipt.yaml) plus 1 secret finding in 1 file
    (docs/evidence/AS-MVP-001-receipt.yaml) = 5 distinct quarantined files.
    The V1 receipt's "4 injection findings" phrase counted files, not
    findings; the quarantined-file total of 5 was and remains correct.
  replay_wording: >-
    Settled-replay semantics stated precisely: the first replay (second
    ingest) mutates via lifecycle NEW→UNCHANGED re-observation (3 state files;
    vault grows 132 → 133 files); the third and subsequent ingests are
    byte-stable. "Zero-mutation replay" refers to the settled (3rd+) run.
