  out_of_scope_detector_limitations: >-
    Non-English instruction phrasing, unrestricted synonym substitution,
    and cross-script homoglyphs outside the explicit static mapping remain
    out of scope for this remediation. This is a deliberate ADR-004
    boundary (deterministic, offline, stdlib/regex-only detection cannot
    exhaustively cover natural-language paraphrase or every Unicode
    confusable without adding LLM/embedding/network dependencies). GOV-006
    (Zs/Zl/Zp mid-keyword) and GOV-007 (tab/LF/CR mid-keyword) are both
    now fully closed. GOV-008 (U+0085 NEXT LINE) is covered by the existing
    Cc handler and requires no additional remediation.
  gov_006_residual_remediation:
    id: AS-SEC-001-GOV-006-RESIDUAL
    status: remediated-verified-closed
    base_commit: 6855f5f165396a2443126cea53d9f0e3b189197b
    implementation_commit: 11edee67cafc63e4a80ad9df247392f90d46e4c0
    evidence_commit: SELF
    owner_decision:
      strategy: bounded-dual-variant
      categories:
        - Zs
        - Zl
        - Zp
      rejected_alternatives:
        - whitelist-style-normalization
        - arbitrary-character-deletion
        - source-content-mutation
        - rendering-changes
        - lifecycle-or-identity-changes
        - broader-unicode-policy-redesign
      scope_authorized: >-
        Extending the existing bounded, deterministic, run-length-aware
        dual-variant normalization strategy GOV-007 established for
        tab/line-feed/carriage-return to Unicode general category Z
        (Zs, Zl, Zp), operating solely on the detector's private
        normalized comparison representation.
    summary: >-
      Closes the mid-keyword Zs/Zl/Zp bypass left open by GOV-007 (limited
      by owner authorization to U+0009/U+000A/U+000D only): a lone
      Zs/Zl/Zp character spliced into a keyword ("Ig<EM SPACE>nore
      previous instructions.") returned zero findings because those
      categories were unconditionally converted to a single space with no
      "collapse an isolated single occurrence" option.
    remediation: >-
      Generalized scan_text()'s tab/line-feed/carriage-return run-length-
      aware dual-variant mechanism into one shared "ambiguous separator"
      class covering tab/LF/CR plus every Unicode Zs/Zl/Zp character
      except the plain keyboard space (U+0020): a run of two or more
      ambiguous-separator characters (any combination) collapses to a
      single space in both variants (an unambiguous, intentional
      boundary); an isolated single occurrence is tested both ways
      (Variant A -> space, Variant B -> removed). Zs/Zl/Zp characters are
      enumerated once at import time from unicodedata.category() over the
      full codepoint range (sys.maxunicode + 1 candidates), not a
      hand-maintained list, discovering exactly 19 characters (matching
      the Unicode 15/16-era Zs/Zl/Zp set: U+0020, U+00A0, U+1680,
      U+2000-U+200A, U+2028, U+2029, U+202F, U+205F, U+3000).
    excluded_character:
      codepoint: U+0020 (SPACE)
      rationale: >-
        Unlike the other 18 Zs/Zl/Zp characters, U+0020 is the
        near-universal word separator throughout ordinary prose - a real
        sentence has an isolated single occurrence of it between every
        pair of words, not occasionally like an em space or a line
        separator. Applying Variant B's "remove an isolated single
        occurrence" rule to it would strip every space in the document
        (verified: this was tried first and broke every previously-
        passing tab/LF/CR mid-keyword test, since it also deleted the
        literal spaces those fixes rely on to satisfy \s+ elsewhere in
        the same sentence), making Variant B unable to match any
        multi-word pattern at all. Splitting a keyword with a literal
        space also produces two ordinary-looking word fragments rather
        than an invisible/exotic Unicode trick - a different, explicitly
        out-of-scope problem (arbitrary fuzzy/edit-distance keyword
        matching), not a Unicode-category evasion. Deliberate, documented
        boundary - not a silently dropped case; see
        test_ascii_space_mid_keyword_split_is_not_a_unicode_evasion_bypass
        in tests/unit/test_quarantine.py and the
        boundary:ascii-space-mid-keyword case in
        tests/unit/test_quarantine_fuzz.py.
    implementation_pitfall_found_and_fixed: >-
      A first implementation naively merged U+0020 into the same
      "ambiguous separator" class as the other 18 Zs/Zl/Zp characters and
      tab/LF/CR, which broke detection for every case (not just the new
      Zs/Zl/Zp ones) because Variant B then removed every ordinary space
      in the document. Separately, unicodedata.normalize("NFKD", text)
      applied to the whole string up front was found to silently collapse
      15 of the 19 discovered Zs characters (em space, no-break space,
      ideographic space, en/em quad, all per-em/figure/punctuation/thin/
      hair spaces, narrow no-break space, medium mathematical space) to a
      plain U+0020 *before* the new Z-category logic ever saw them,
      because NFKD compatibility decomposition maps those characters to
      space. Fixed by checking each original character's Unicode category
      before decomposition and only NFKD-decomposing characters that are
      not already Zs/Zl/Zp (letters still decompose normally, exposing
      combining marks for stripping; only three Zs/Zl/Zp characters -
      U+1680 OGHAM SPACE MARK, U+2028 LINE SEPARATOR, U+2029 PARAGRAPH
      SEPARATOR - have no NFKD decomposition at all, so without this fix
      only those three would have worked and the other 15 would have
      silently fallen into the U+0020 exclusion instead).
    strict_xfail_disposition: >-
      test_zs_zl_zp_mid_keyword_known_gap (xfail, strict=True, in
      tests/unit/test_quarantine_fuzz.py) was kept unmodified until the
      production fix was implemented and the new focused unit tests in
      tests/unit/test_quarantine.py passed; then re-run without the xfail
      marker to confirm it passes for real, then renamed (not deleted) to
      test_zs_zl_zp_mid_keyword_gap_is_closed and its evasion set widened
      from 4 representative characters to all 18 runtime-discovered
      non-space Zs/Zl/Zp characters.
    normalization_order: >-
      1) For each original character: if it is category Zs/Zl/Zp, keep it
      unexpanded (preserves identity against NFKD's compatibility
      decomposition to space); otherwise NFKD-decompose it individually
      (no-op for characters with no decomposition). 2) From that
      per-character decomposition, strip Cf (format control) and Mn
      (combining mark) categories. 3) Strip every Cc control character
      except tab/line-feed/carriage-return. 4) Apply the static
      confusable-character mapping. 5) scan_text() derives two final
      variants from that shared intermediate string using one combined
      ambiguous-separator regex (tab/LF/CR union Zs/Zl/Zp minus U+0020):
      Variant A collapses every run (any length) to one space; Variant B
      collapses runs of 2+ to one space but removes an isolated single
      occurrence entirely. Both variants are matched against the
      unchanged pattern set and findings are unioned.
    diff_scope: >-
      confirmed via git diff --stat and git diff --name-status between the
      base commit 6855f5f165396a2443126cea53d9f0e3b189197b and the
      implementation commit: only src/project_atlas/quarantine.py changed
      in production code; git diff --stat against
      atlas-vault-documentation/, AGENT-BOOTSTRAP.md, .atlas/ is empty.
    prohibited_behaviors_checked: >-
      no whitelist normalization introduced; no arbitrary character
      deletion beyond the already-authorized bounded categories; no
      source-content mutation (raw source bytes/hashes unchanged,
      normalization is scan_text()-internal only); no rendering changes;
      no lifecycle or identity changes; no new promotion boundary; no
      tokenization redesign (same _PATTERNS, unchanged).
    gov_007_status: remediation-preserved (tab/LF/CR behavior unchanged; all
      GOV-007 fixtures and tests still pass unmodified)
    gov_008_status: closed-already-covered (U+0085 remains handled by the
      existing Cc-other-than-tab/LF/CR removal path, unaffected by this
      change)
