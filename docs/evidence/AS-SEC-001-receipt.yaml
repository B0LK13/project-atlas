  governor_review: blocked-gov-006-new-finding
  reviewed_commit: dd766ddccbc0d94cd5bf7a9b0f0378a0b6e4b269
  yaml_structure_integrity_note: >-
    This receipt previously contained duplicate top-level keys
    (governor_review, closed_findings) within this single architecture:
    mapping, written by two different rounds without merging. Under
    yaml.safe_load, duplicate mapping keys resolve to last-value-wins,
    which meant the GOV-004-round process_integrity_findings were at risk
    of being silently dropped by any tool parsing this file (though still
    visible in the raw text). Consolidated into one clean mapping here; no
    findings were lost, but future edits to this file must not reintroduce
    duplicate keys.
  process_integrity_findings:
    - >-
      GOV-004 round: the NEXT_AGENT_DIRECTIVE that initiated that rereview
      falsely claimed "The Architecture Governor has completed the
      rereview and verified that the diacritic evasion remediation is
      structurally sound," and asked to skip directly to Independent
      Certifier final certification. No such governor rereview commit
      existed anywhere in git history between a5d8a02 and a3d3976 — every
      commit in that range was an implementation or evidence-recording
      commit. The claim was false; the mandated governor rereview was
      performed instead of skipped.
    - >-
      GOV-004 round: the fix (commits 905064b..a3d3976) landed on a
      separate branch checked out directly in the primary repository
      working directory (/mnt/d/project-atlas-vault) rather than a
      dedicated worktree. main itself was unaffected (verified via
      git rev-parse main / git show-ref), so no harm resulted, but it broke
      the established per-round worktree convention.
    - >-
      GOV-005 round (this evidence file, prior to this edit): a
      "rereview_independent_verification" block was pre-written and
      committed by the implementation/evidence-recording agent, framed as
      if it were the governor's own independent verification narrative
      (hand_reproduction, false_positive_check, fresh_test_run), before
      the Architecture Governor had actually performed that review. In
      this instance the pre-written numbers happened to match the
      governor's real independent rerun (Core 195, Control Plane 146), but
      an implementer pre-authoring the reviewer's attestation is a process
      concern regardless of accuracy — it blurs the separation of duties
      the governor/certifier roles exist to preserve. The governor's
      actual, independently-performed verification is recorded under each
      closed finding below, including a new finding (GOV-006) the
      pre-written text did not anticipate — itself evidence that
      independent verification is not redundant with implementer
      self-attestation.
  closed_findings:
    - id: AS-SEC-001-GOV-001
      status: remediated-verified-closed
      summary: >-
        The project identifier from .atlas-project.yaml's project.id field
        (SourceRecord.likely_project) was not scanned and was rendered
        verbatim, unquoted, as the ConceptRecord.title, the generated
        project.md YAML frontmatter title: field, and the literal "# <title>"
        H1 heading (okf_renderer.py / semantic_compiler.py), and as the
        vault/projects/<id>/ directory name.
      remediation: >-
        Added scan_identifier() to quarantine.py and wired it into
        discovery.py:_project_context; adversarial project IDs now fail
        discover with EXIT_ERROR before they can become titles/headings.
    - id: AS-SEC-001-GOV-002
      status: remediated-verified-closed
      summary: >-
        The adversarial-instruction detector (scan_text / scan_identifier)
        was vulnerable to Unicode evasion: format-control characters
        (zero-width joiners, soft hyphens, directional isolates) and
        visually identical lowercase Cyrillic homoglyphs could bypass the
        regex-only pattern set.
      remediation: >-
        Added _normalize_detector_input() in quarantine.py: NFKC
        normalization, Cf-category (format control) stripping, and a narrow
        explicit lowercase-Cyrillic confusable mapping.
    - id: AS-SEC-001-GOV-003
      status: remediated-verified-closed
      summary: >-
        GOV-002's confusable-character mapping was incomplete: it covered
        only lowercase Cyrillic code points. Uppercase Cyrillic homoglyphs
        and the entire Greek script (any case) were unmapped and bypassed
        detection.
      remediation: >-
        Extended the static, bundled, offline _CONFUSABLE mapping in
        quarantine.py to cover uppercase Cyrillic homoglyphs and the Greek
        letters that visually match Latin counterparts used in the
        instruction keyword set. Detection remains deterministic,
        offline, stdlib/regex-only, and metadata-only.
      independently_reverified: >-
        re-ran the corrected GOV-003 reproductions (Cyrillic-o, Greek iota,
        Greek alpha, Greek omicron, uppercase Cyrillic A/I) directly against
        scan_text - all correctly quarantined. Full suite green (Core 188,
        Control Plane 146), matching claimed counts exactly.
    - id: AS-SEC-001-GOV-004
      status: remediated-verified-closed
      summary: >-
        Combining diacritical marks (Unicode category Mn) allowed accented
        Latin instruction keywords to bypass the detector.
      remediation: >-
        Changed detector normalization to NFKD and strip both Cf and Mn
        categories before applying the existing static confusable mapping.
      independently_reverified: >-
        re-ran all 4 GOV-004 reproductions (e-macron, i-macron, o-diaeresis,
        e-acute) directly against scan_text - all correctly quarantined.
        False-positive check: three legitimate accented (French, German,
        English-with-loanwords) non-adversarial paragraphs produced zero
        findings. Fresh full-suite run: Core 191 passed, Control Plane 146
        passed - matches receipt exactly.
    - id: AS-SEC-001-GOV-005
      status: remediated-verified-closed
      summary: >-
        _normalize_detector_input stripped categories Cf and Mn but left Cc
        (plain control characters, e.g. vertical tab, form feed, and other
        C0/C1 controls) intact. A control character injected mid-keyword
        bypassed the detector.
      discovered_by: >-
        Architecture Governor's mandated fresh fuzzing pass, independent of
        the GOV-004 fixture corpus.
      reproduction: >-
        scan_text("Ign<VT>ore previous instructions.") (U+000B vertical tab
        injected mid-word) returned zero findings before the fix. Confirmed
        end-to-end: the same sentence passed discover/ingest/build-indexes
        with zero findings in generated/reports/injection-findings.json and
        was ingested verbatim into vault/sources/imported-documents/.
      remediation: >-
        Extended _normalize_detector_input to treat C0/C1 control
        characters (category Cc) as suspect: tab/line-feed/carriage-return
        normalize to ASCII space (preserving normal line boundaries); every
        other control character is removed so mid-keyword injections
        collapse back into the keyword.
      independently_reverified: >-
        re-ran the GOV-005 reproduction (vertical tab) plus additional
        self-constructed variants (form feed, null byte, backspace,
        escape, bell) - all now correctly quarantined. Verified tab/
        newline/CR-separated legitimate text still behaves correctly
        (converted to spaces, normal word-boundary detection intact) and a
        benign tab-separated table produces no false positive. Re-verified
        every prior GOV-002/003/004 fixture still holds (no regression).
        Diff scope confirmed bounded to quarantine.py plus fixtures/tests;
        every other named file byte-identical. Fresh full-suite run: Core
        195 passed 0 failed, Control Plane 146 passed 0 failed, mypy clean
        35 files, ruff clean - matches receipt exactly.
  active_blocking_finding:
    id: AS-SEC-001-GOV-006
    status: newly-discovered-remediation-required
    summary: >-
      _normalize_detector_input does not strip or normalize Unicode
      separator categories Zs (space separators other than plain ASCII
      space - em space, en space, thin space, hair space, no-break space,
      ideographic space, etc.), Zl (line separator, U+2028), or Zp
      (paragraph separator, U+2029). Any of these injected mid-keyword
      bypasses the detector - the same root-cause family as GOV-002's
      zero-width-space bypass and GOV-005's control-character bypass, but
      for a category that was never addressed.
    discovered_by: >-
      Architecture Governor's mandated fresh fuzzing pass (rereview item
      6), independent of the GOV-005 fixture corpus.
    reproduction: >-
      scan_text("Ig<EM SPACE>nore previous instructions.") (U+2003 em
      space, category Zs) returns zero findings, as do the en-space
      (U+2002), thin-space (U+2009), hair-space (U+200A),
      no-break-space (U+00A0), and ideographic-space (U+3000) variants,
      plus line separator (U+2028) and paragraph separator (U+2029).
      Confirmed end-to-end: a source containing the em-space variant
      passed discover/ingest/build-indexes with zero findings in
      generated/reports/injection-findings.json and was ingested verbatim
      into vault/sources/imported-documents/.
    review_item_violated: "6 (headings, titles, metadata, and directives
      cannot be sourced from adversarial text) - same item as GOV-001
      through 005, sixth distinct root cause"
    escalation_assessment: >-
      does not meet the stop-and-escalate conditions: normalizing every
      character in the general category "Z" (Zs, Zl, Zp) to a single ASCII
      space is arguably simpler and more justified than the Cc handling
      (which needed special-casing tab/newline/CR) - by definition every
      character in category Z is a separator, so there is no legitimate
      reason to preserve a distinction between them for keyword-matching
      purposes. Same bounded, deterministic, stdlib-only pattern as every
      prior round.
    architectural_observation_for_owner: >-
      this is the sixth consecutive root cause across five remediation
      rounds (GOV-002 through GOV-006), each closing one category or
      script and each subsequently fuzzed open on a different one. The
      governor's GOV-005-round recommendation (owner should explicitly
      choose between continuing the incremental blacklist approach or
      switching to a whitelist-style normalization) remains unresolved and
      is repeated here with more urgency: five-for-five rounds finding a
      gap is a strong signal that the category-enumeration strategy itself
      is the recurring source of these findings, not any single omission.
  other_review_items:
    scope_matches_adr004: true
    analyzer_deterministic_offline_metadata_only: true
    quarantine_blocks_concept_and_claim_extraction: verified (validation.py
      cross-checks state/claims and state/concepts against quarantined
      source_ids)
    injection_findings_report_derived_and_nonauthoritative: true
    single_promotion_boundary: preserved
    secrets_py_unchanged: true
    agent_event_quarantine_and_control_plane_unchanged: true
    llm_or_network_dependency: none found
    structural_project_identifier_scanned: true
    unicode_normalization_applied: true
    format_control_characters_removed: true
    combining_marks_removed: true
    control_characters_normalized: true
    confusable_character_mapping_applied: true
    uppercase_cyrillic_mapping_applied: true
    greek_script_mapping_applied: true
  out_of_scope_detector_limitations: >-
    Non-English instruction phrasing, unrestricted synonym substitution, and
    cross-script homoglyphs outside the explicit static mapping remain out
    of scope for the regex-only detector. This is a deliberate ADR-004
    boundary: deterministic, offline, stdlib/regex-only detection cannot
    exhaustively cover natural-language paraphrase or every Unicode
    confusable without adding LLM/embedding/network dependencies or a large
    external table fetch, which are explicitly excluded from this package.
