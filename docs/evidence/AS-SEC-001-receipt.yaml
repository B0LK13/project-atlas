  out_of_scope_detector_limitations: >-
    Non-English instruction phrasing and unrestricted synonym substitution
    remain out of scope for the regex-only detector. This is a deliberate
    ADR-004 boundary: deterministic, offline, stdlib/regex-only detection
    cannot exhaustively cover natural-language paraphrase or every language
    without adding LLM/embedding/network dependencies, which are explicitly
    excluded from this package.
