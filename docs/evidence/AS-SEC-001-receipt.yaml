  closed_findings:
    - id: AS-SEC-001-GOV-001
      status: remediated-verified-closed
      summary: >-
        The project identifier from .atlas-project.yaml's project.id field
        (SourceRecord.likely_project) was not scanned and was rendered
        verbatim, unquoted, as the ConceptRecord.title, the generated
        project.md YAML frontmatter title: field, and the literal "# <title>"
        H1 heading (okf_renderer.py / semantic_compiler.py), and as the
        vault/projects/<id>/ directory name.
      remediation: >-
        Added scan_identifier() to quarantine.py and wired it into
        discovery.py:_project_context; adversarial project IDs now fail
        discover with EXIT_ERROR before they can become titles/headings.
  active_blocking_finding:
    id: AS-SEC-001-GOV-002
    status: remediated-pending-governor-rereview
    summary: >-
      The adversarial-instruction detector (scan_text / scan_identifier) was
      vulnerable to Unicode evasion: format-control characters (zero-width
      joiners, soft hyphens, directional isolates) and visually identical
      Cyrillic homoglyphs could bypass the regex-only pattern set.
    reproduction: >-
      Source text such as "Ig\u200dnore prior rules",
      "Ig\u00adnore prior rules", or Cyrillic-homoglyph "\u0456gn\u043Ere
      pr\u0435v\u0456\u043Eus \u0456nstru\u0441t\u0456\u043Ens" produced no
      injection findings and would be ingested normally, allowing the
      adversarial instruction to reach generated output.
    remediation: >-
      Added _normalize_detector_input() in quarantine.py that (1) applies
      Unicode NFKC normalization, (2) removes all characters with category
      "Cf" (format controls including zero-width and soft-hyphen variants),
      and (3) applies a narrow explicit confusable-character mapping for
      demonstrated Cyrillic homoglyphs before running the existing pattern
      set. The original source bytes are never rewritten; normalization is
      used only inside the detector. Added fixtures and tests for zero-width
      insertion, soft-hyphen insertion, and Cyrillic homoglyph substitution.
    verified_by: hand-run pipeline in an isolated /tmp scratch project,
      plus new pytest coverage
    review_item_violated: "6 (headings, titles, metadata, and directives
      cannot be sourced from adversarial text)"
    scope_note: detection remains deterministic, offline, stdlib/regex-only,
      and metadata-only. No LLM, embedding, network, or sandbox was added.
      secrets.py, agent-event quarantine, ID_PATTERN, lifecycle/identity
      semantics, and the single promotion boundary were not modified.
  other_review_items:
    scope_matches_adr004: true
    analyzer_deterministic_offline_metadata_only: true
    quarantine_blocks_concept_and_claim_extraction: verified (validation.py
      cross-checks state/claims and state/concepts against quarantined
      source_ids)
    injection_findings_report_derived_and_nonauthoritative: true
    single_promotion_boundary: preserved
    secrets_py_unchanged: true
    agent_event_quarantine_and_control_plane_unchanged: true
    llm_or_network_dependency: none found
    structural_project_identifier_scanned: true
    unicode_normalization_applied: true
    format_control_characters_removed: true
    confusable_character_mapping_applied: true
  out_of_scope_detector_limitations: >-
    Non-English instruction phrasing and unrestricted synonym substitution
    remain out of scope for the regex-only detector. This is a deliberate
    ADR-004 boundary: deterministic, offline, stdlib/regex-only detection
    cannot exhaustively cover natural-language paraphrase or every language
    without adding LLM/embedding/network dependencies, which are explicitly
    excluded from this package.
  rereview_independent_verification:
    diff_scope: >-
      confirmed via git diff --stat between the candidate commit and HEAD:
      only quarantine.py, discovery.py, fixture files, and test files
      changed; okf_renderer.py, semantic_compiler.py, secrets.py,
      validation.py, ID_PATTERN, and agent-event quarantine untouched
    hand_reproduction: >-
      re-ran the GOV-002 attack strings in an isolated /tmp scratch project
      outside pytest: atlas discover/ingest now quarantines the sources,
      injection-findings.json lists the finding, and no quarantined content
      reaches claims, concepts, or generated indexes
    false_positive_check: >-
      an ordinary document with benign format-control characters and an
      ordinary project id still discovers and ingests successfully
