      injection-findings.json lists the finding, and no quarantined content
      reaches claims, concepts, or generated indexes
    false_positive_check: >-
      an ordinary document with benign format-control characters and an
      ordinary project id still discovers and ingests successfully
    fresh_test_run: Core 183 passed 0 failed; Control Plane 146 passed 0
