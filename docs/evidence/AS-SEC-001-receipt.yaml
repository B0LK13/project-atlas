owner_normalization_decision:
  finding: AS-SEC-001-GOV-007
  disposition: bounded-deterministic-category-handling
  rejected_alternative: whitelist-style-normalization
  rationale_summary: >-
    Owner selected Option 1 (continue bounded deterministic normalization)
    over whitelist-style normalization for this remediation. Whitelist
    normalization would change the entire accepted character model, increase
    false-positive risk, alter multilingual behavior, and require an
    explicit preservation contract for punctuation/symbols/scripts/
    whitespace/formatting - broadening the detector from bounded evasion
    resistance into canonical text reconstruction. That may be proposed
    later through a dedicated ADR and architecture-entry gate; it must not
    be introduced incrementally or implicitly in this remediation.
  scope_authorized: closing only U+0009 (tab), U+000A (line feed), and
    U+000D (carriage return) mid-keyword evasion, operating solely on the
    detector's private comparison representation.

