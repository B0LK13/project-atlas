    - id: AS-SEC-001-GOV-006
      status: remediated-pending-governor-rereview
      summary: >-
        _normalize_detector_input did not normalize Unicode separator
        categories Zs, Zl, and Zp to ASCII space, so non-ASCII separators
        (em space, no-break space, line separator, paragraph separator,
        etc.) used between instruction keywords bypassed the detector.
      discovered_by: >-
        Architecture Governor's mandated fresh fuzzing pass (rereview item
        6), independent of the GOV-005 fixture corpus.
      reproduction: >-
        scan_text("Ignore<EM SPACE>previous instructions.") (U+2003 em
        space, category Zs) returned zero findings, as did no-break space,
        line separator (U+2028), and paragraph separator (U+2029) variants.
        Confirmed end-to-end: a source containing such variants passed
        discover/ingest/build-indexes with zero findings in
        generated/reports/injection-findings.json and was ingested verbatim
        into vault/sources/imported-documents/.
      remediation: >-
        Extended _normalize_detector_input in quarantine.py to normalize
        every character in Unicode general category "Z" (Zs, Zl, Zp) to a
        single ASCII space. All Z-category characters are separators by
        definition, so this requires no special-casing. Detection remains
        deterministic, offline, stdlib/regex-only, and metadata-only.
      owner_consulted_on_architecture: >-
        The owner has NOT been consulted yet on the repeated
        blacklist-vs-whitelist architectural question raised by the
        Architecture Governor in the GOV-005 and GOV-006 rereviews. This
        implementation follows the bounded remediation instructions for
        GOV-006 and surfaces the observation plainly; it does not make the
        owner-level decision.
