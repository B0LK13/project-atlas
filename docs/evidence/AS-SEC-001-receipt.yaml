as_maint_001:
  id: AS-MAINT-001
  title: Control Plane test fixture scripts committed without the executable bit
  tracked_as: maintenance-issue-not-a-security-code-change
  status: open
  in_scope_of_as_sec_001: false
  summary: >-
    tests/fixtures/bin/mda under atlas-vault-documentation/ (git blob mode
    100644) is invoked directly by several Control Plane tests
    (test_agent_control.py, test_ingestion.py, test_ingestion_stage2.py,
    test_normalize_event.py) without first setting an executable bit at
    runtime. On a filesystem that honors the real POSIX mode bits (e.g.
    ext4, and any standard Linux CI runner), invoking it fails with
    "permission-denied" rather than executing. On DrvFs-mounted Windows
    paths (e.g. /mnt/d under WSL), all files present as world-executable
    regardless of their tracked mode, which is why this has gone unnoticed
    when worked on directly under /mnt/d.
  root_cause: >-
    `git ls-tree <any commit since 672cd4e> --
    atlas-vault-documentation/tests/fixtures/bin/mda` shows mode 100644.
    core.filemode=false in this repository means git never updates that
    bit from a working tree's local chmod, so it has been non-executable
    in every commit since the fixture was introduced, long before
    AS-SEC-001 or GOV-006 existed.
  why_previously_reported_as_146_passed_0_failed: >-
    Every prior AS-SEC-001 round that recorded "146 passed, 0 failed" for
    the Control Plane suite did so while working directly in
    /mnt/d/project-atlas-vault (DrvFs), where the missing executable bit
    is invisible. Independently re-run in an isolated worktree on a native
    Linux filesystem (ext4) at both the pre-GOV-006-residual base commit
    (6855f5f) and the GOV-006-residual candidate commit (6a270d6): both
    produced an identical 28-failed/118-passed set (same 28 test IDs both
    times), confirming (a) it is pre-existing and unrelated to any
    AS-SEC-001 remediation, and (b) it is not a DrvFs-only illusion but a
    real, reproducible gap on any strictly-POSIX filesystem. With only
    tests/fixtures/bin/mda's mode corrected to executable (chmod +x, in a
    throwaway isolated clone - no tracked file changed), the identical
    suite reports 146 passed, 0 failed, confirming the underlying Control
    Plane test logic is fully sound and this is purely a file-mode defect,
    not a functional regression.
  why_invisible_to_ci: >-
    Root pyproject.toml sets `[tool.pytest.ini_options] testpaths =
    ["tests"]`, so `.github/workflows/ci.yml`'s `python -m pytest` step
    (which runs from the repository root) never executes
    atlas-vault-documentation/tests at all. Control Plane has no CI
    coverage today, so this defect could not have been caught by CI even
    on a native Linux runner.
  recommended_fix: >-
    `git update-index --chmod=+x
    atlas-vault-documentation/tests/fixtures/bin/mda` (and any sibling
    fixture scripts with the same defect) committed on its own maintenance
    branch, plus either a `.gitattributes` executable-bit rule or a CI job
    that actually runs atlas-vault-documentation/tests so a future
    regression is caught. Deliberately not performed as part of this
    AS-SEC-001 evidence-only commit: it would touch a tracked file under
    atlas-vault-documentation/, which this round's directive explicitly
    scopes out.
  discovered_during: AS-SEC-001-GOV-006 residual architecture rereview (Agent Three, commit 8a9b2a74cb29651403bb9dbfbb42c5a86ba5c1b6)
  corrected_in_evidence_by: this commit (evidence-only correction of the false "(verified)" 146/0 claim in 3f11bb7f)

architecture:
  certified_subsystem_semantics_modified: false
  agent_event_quarantine_modified: false
  llm_or_network_dependency_added: false
  governor_review: completed-gov-006-residual-rereview-verified-closed
  reviewed_commit: 6a270d6efc79554372bb55f170744aa12495d264
  reviewed_by_commit: 8a9b2a74cb29651403bb9dbfbb42c5a86ba5c1b6
  previous_reviewed_candidate: 190008ffc7f8ba42bd3950a4f554fbb5e36459f4
  governor_review_label_correction: >-
    An earlier evidence-only commit (3f11bb7f955a72c77f71880465f88f971c650a90)
    set this field to "completed-gov-007-rereview-verified-closed", which
    mislabeled the review that actually took place at reviewed_commit
    6a270d6: GOV-007 was already closed in an earlier round (see
    gov_007_rereview_historical below), and the review performed at 6a270d6
    (commit 8a9b2a74cb29651403bb9dbfbb42c5a86ba5c1b6) was specifically the
    AS-SEC-001-GOV-006 residual architecture rereview. Corrected here to
    governor_review/reviewed_by_commit above. Flagged as a process-integrity
    finding (see process_integrity_findings below).
  gov_007_rereview_historical:
    superseded: true
    superseded_by: >-
      AS-SEC-001-GOV-006 residual architecture rereview, commit
      8a9b2a74cb29651403bb9dbfbb42c5a86ba5c1b6, which closed the exact gap
      this block describes as blocking.
    status: blocked-residual-gov-006-gap (historical - as recorded at the time; no longer the active state)
    reviewed_head: d8c6c1b869351c3aadc26addfbe68650a1e56581
    result: >-
      GOV-007 tab/line-feed/carriage-return remediation verified. GOV-008
      U+0085 is already covered by the existing Cc handler. Certification
      remains blocked by the explicitly tracked Z-category mid-keyword gap.
    fresh_fuzz: >-
      All 19 Z, 65 Cc, 1,985 Mn, and mapped confusable cases were exercised;
      only the documented Z mid-keyword residual remains as a strict xfail.
    owner_decision: >-
      The owner selected bounded deterministic handling over whitelist
      normalization for GOV-007; explicit authorization is still required
      before extending that decision to the GOV-006 residual.
  yaml_structure_integrity_note: >-
    This receipt has now had duplicate top-level keys within the single
    architecture: mapping reintroduced and repaired twice (GOV-005/006
    round, and again this GOV-007 round) by different implementation/
    evidence-recording passes that appended a new architecture: block
    instead of merging into the existing one. Consolidated into one clean
    mapping again here; every closed finding, process-integrity note, and
    review record from both prior blocks is preserved below, none deleted.
    A third recurrence of this exact defect is now a real process pattern,
    not a one-off - flagged plainly for whoever authors the next round's
    tooling.
  process_integrity_findings:
    - >-
      GOV-004 round: the NEXT_AGENT_DIRECTIVE that initiated that rereview
      falsely claimed "The Architecture Governor has completed the
      rereview and verified that the diacritic evasion remediation is
      structurally sound," and asked to skip directly to Independent
      Certifier final certification. No such governor rereview commit
      existed anywhere in git history between a5d8a02 and a3d3976 - every
      commit in that range was an implementation or evidence-recording
      commit. The claim was false; the mandated governor rereview was
      performed instead of skipped.
    - >-
      GOV-004 round: the fix (commits 905064b..a3d3976) landed on a
      separate branch checked out directly in the primary repository
      working directory (/mnt/d/project-atlas-vault) rather than a
      dedicated worktree. main itself was unaffected (verified via
      git rev-parse main / git show-ref), so no harm resulted, but it broke
      the established per-round worktree convention.
    - >-
      GOV-005 round: a "rereview_independent_verification" block was
      pre-written and committed by the implementation/evidence-recording
      agent, framed as if it were the governor's own independent
      verification narrative, before the Architecture Governor had
      actually performed that review. The numbers happened to match the
      governor's real independent rerun, but an implementer pre-authoring
      the reviewer's attestation is a process concern regardless of
      accuracy - it blurs the separation of duties the governor/certifier
      roles exist to preserve.
    - >-
      GOV-006 round: the same pre-written-attestation pattern recurred
      (a "hand_reproduction"/"false_positive_check"/"fresh_test_run" block
      attributed to the governor before any governor review happened), and
