# AS-ORIGIN-ACCEPTANCE-001: explicit backlog acceptance contracts.
#
# One entry per (source_path, item_id) pair from an explicitly declared
# origination source (see .atlas-project.yaml's own
# `origination_sources:` key). A task-list checkbox in docs/backlog.md
# carries no evidence/scope/criteria of its own -- by design, nothing is
# ever inferred from its title. A contract here is the explicit,
# reviewable alternative: real evidence a human authored and committed,
# never guessed.
#
# See src/project_atlas/orchestration/origination/acceptance_contracts.py
# for the schema and validation this file is checked against.

schema_version: 1

contracts:
  - item_id: INT-013
    source_path: docs/backlog.md
    # Origination-truth reconciliation (owner review, 2026-09-02): this
    # contract widens EVIDENCE for the bounded, fixture-backed technical
    # pilot only -- it does not and cannot clear INT-013's real blocker.
    # docs/backlog.md's own INT-013 line now carries an explicit
    # EXTERNAL_BLOCKED continuation (owner-provided authentic project
    # roots required); acceptance_contracts.py's own module docstring
    # states the invariant this relies on: "a contract widens evidence,
    # never authority" -- verified for this exact keyword by
    # tests/unit/test_orchestration_acceptance_contracts.py::
    # test_external_blocked_item_stays_blocked_even_with_a_valid_contract.
    # The evidence path below names the fixture-backed bounded
    # multi-project pilot test. That test has been executed
    # successfully as real supervised-run evidence and is intended to
    # remain an ongoing fixture-backed integration regression going
    # forward -- but regardless of its skip state on any given carrier
    # commit, passing it proves the bounded pilot composes correctly
    # against committed fixture data; it does NOT prove authentic
    # INT-013, and this contract must never be read as claiming
    # otherwise.
    evidence:
      - tests/integration/test_int_013_bounded_multi_project_pilot.py
    proposed_scope:
      - tests/integration/test_int_013_bounded_multi_project_pilot.py
      - WORKLOG.md
    success_criteria:
      - "tests/integration/test_int_013_bounded_multi_project_pilot.py runs unskipped and passes, exercising two real, independent projects (harbor-api, harbor-ops) through the full production pipeline (init/discover/ingest/build-indexes/build-portfolio) plus AS-XPROJ-001/002/003 in one pilot run"
      - "NO_AUTHORITY_MERGE: neither project's own vault content is modified by any xproj operation"
      - "BOUNDED_SCOPE: every xproj-derived output stays under its documented derived-only location"
