schema_version: 1

project:
  id: project-atlas
  name: Project Atlas
  aliases:
    - atlas
  type: documentation-platform
  status: active

discovery:
  documentation_roots:
    - .
    - docs
    - src
  include:
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
  exclude:
    - ".git/**"
    - ".venv/**"
    - ".tmp/**"
    - "fixtures/**"
    - "**/fixtures/**"
    - "node_modules/**"
    - ".atlas-vault/**"
    - ".atlas/**"

authority:
  primary:
    - "README.md"
    - "AGENTS.md"
    - "docs/plan.md"
    - "docs/prp.md"
    - "docs/product/CODER-ALPHA-NORTH-STAR.md"
  derived:
    - "generated/**"
