schema_version: 1

project:
  id: project-atlas
  name: Project Atlas
  aliases:
    - atlas
  type: documentation-platform
  status: active

discovery:
  documentation_roots:
    - .
    - docs
    - src
  include:
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
  exclude:
    - ".git/**"
    - ".venv/**"
    - ".tmp/**"
    - "fixtures/**"
    - "**/fixtures/**"
    - "node_modules/**"
    - ".atlas-vault/**"
    - ".atlas/**"

authority:
  primary:
    - "README.md"
    - "AGENTS.md"
    - "docs/plan.md"
    - "docs/prp.md"
    - "docs/product/CODER-ALPHA-NORTH-STAR.md"
  derived:
    - "generated/**"

# D-PHASE2A-RETRY (ORIGINATION_SOURCE_PARITY): explicit declaration of
# this project's own authoritative origination source(s) for
# `atlas originate` (AS-ORIGIN-001). docs/ROADMAP.md remains supported
# unconditionally (unchanged, pre-existing default); this project does
# not maintain one, so it is not declared here. docs/backlog.md is this
# project's actual, real executable planning source (Markdown task-list
# checkboxes) -- declaring it here is what makes it authoritative;
# nothing scans it otherwise.
origination_sources:
  - path: docs/backlog.md
    format: markdown-task-list
