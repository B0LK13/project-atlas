# Test config scoped to the ATLAS-FOR-CHATGPT-READONLY-001 integration.
# Kept out of the repo-root pyproject [tool.pytest.ini_options] so the main
# suite's coverage gate is untouched. When pytest is invoked against this
# directory (or its tests/), this file is the configfile/rootdir, which enables
# pytest-asyncio for the async MCP server handler tests.
[pytest]
testpaths = tests
asyncio_mode = auto
