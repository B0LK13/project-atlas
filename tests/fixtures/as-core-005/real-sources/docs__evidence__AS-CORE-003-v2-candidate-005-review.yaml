v2_003_findings_retest:
  - id: V2-003-R1
    status: resolved
    evidence: >-
      Migration resolves ingested source_id through the source registry and
      current manifest to canonical project UUID and source_lineage_id;
      shared extractor retains unmodified legacy_value including anchors,
      covers all seven text suffixes, shares the architecture fallback, and
      fails closed on unresolved locators. Merge-base v1 formula compared
      verbatim against _v1_claim_id: identical construction.
  - id: V2-003-R2
    status: resolved
    evidence: >-
      Alias map and receipt are staged in one temp directory, cross-validated,
      and made canonical by a single os.replace; a missing or mismatched
      receipt on replay is rejected (_load_existing_bundle fails closed).
  - id: V2-003-R3
    status: resolved
    evidence: >-
      project_id passes atlas_contracts.identity.safe_relative_component and
      every state path is re-checked with _inside(vault_root, ...).
  - id: V2-003-R4
    status: resolved
    evidence: >-
      Per-project bundle under state/claim-alias-maps/<project>/ with a
      per-project lock keyed by the safe component digest; projects are
      isolated (test_projects_have_isolated_alias_bundles_and_history).
  - id: V2-003-R5
    status: resolved
    evidence: >-
      test_ingestion_mid_promotion_failure_rolls_back_every_file injects a
      fault at the second staged replace, proves a real first promotion,
      complete snapshot rollback, artifact cleanup, lock release, clean
      retry, and byte-identical replay.
  - id: V2-003-R6
    status: resolved
    evidence: >-
      _validate_alias_payload rejects resolved/ambiguous overlap on write and
      on replay (test_existing_alias_map_rejects_resolved_ambiguous_overlap).
non_blocking_findings:
  - id: V2-005-N1
    severity: low
    summary: >-
      extract_claims architecture fallback resolves its locator against the
      first pass's final heading rather than the nearest preceding heading.
      Behavior is deterministic and identical for compiler and migration, so
      identity parity holds, but a trailing-heading edit can re-identify an
      unchanged architecture claim. Recommend proper heading-scoped locators
      in the Phase P1 parser-framework package.
  - id: V2-005-N2
    severity: low
    summary: >-
      Migration audit.migrated_at is a wall-clock timestamp, so an alias
      payload is not reproducible bit-for-bit from scratch. Idempotent replay
      short-circuits before recomputation and the receipt binds the state
      hash, so no divergence can result.
  - id: V2-005-N3
    severity: low
    summary: >-
      _scan_historical_sources returns empty history for a vault without Git
      history, producing a successful zero-claim migration. Acceptable for
      the current contract; worth documenting when parser-framework work
      defines compilation outcome semantics.
